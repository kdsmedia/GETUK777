syntax = "proto3";

package game.v1;

option java_multiple_files = true;
option java_package = "com.nekgamebling.game.v1";

import "google/protobuf/struct.proto";

enum AggregatorTypeDto {
  AGGREGATOR_TYPE_UNSPECIFIED = 0;
  AGGREGATOR_TYPE_CASINO = 1;
  AGGREGATOR_TYPE_SPORTBOOK = 2;
}

message AggregatorDto {
  string identity = 1;

  string integration = 2;

  google.protobuf.Struct config = 3;

  bool active = 4;

  AggregatorTypeDto type = 5;
}
