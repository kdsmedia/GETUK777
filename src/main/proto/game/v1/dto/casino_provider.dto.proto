syntax = "proto3";

package game.v1;

option java_multiple_files = true;
option java_package = "com.nekgamebling.game.v1";

message CasinoProviderDto {
  string identity = 1;

  string name = 2;

  map<string, string> images = 3;

  int32 order = 4;

  bool active = 5;

  string aggregator_identity = 6;

  repeated string blocked_country = 7;

  repeated string tags = 8;

  // Other spellings of this same vendor used by other aggregators (`egt` for `amusnet`,
  // `pragmatic` for `pragmatic_play`). The catalog sync writes these itself when it merges a
  // duplicate; sending the field back empty on Save erases what it learned.
  repeated string aliases = 9;
}
