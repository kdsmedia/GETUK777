syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

import "game/v1/dto/collection.dto.proto";
import "game/v1/dto/common.dto.proto";
import "game/v1/dto/casino_game_filter.dto.proto";
import "game/v1/dto/casino_game_page.dto.proto";

// ---------------------------------------------------------------------------
// Collection catalog service — full CRUD plus game-membership management.
//
// Every Save is a typed upsert (create-or-update) with explicit fields,
// mirroring `application.command.collection.SaveCollectionCommand` on the
// Kotlin side. FindAll takes a dedicated CollectionFilter sub-message.
// FindAllCasinoGame returns the games that belong to a given collection — same
// filter and response shape as `CasinoGameService.FindAll`, plus the collection
// identity the caller is narrowing by, ordered by the per-collection
// position managed through AddCasinoGame / RemoveCasinoGame / UpdateCasinoGameOrder.
//
// CasinoGame-in-collection membership is managed with three single-game RPCs:
//   - AddCasinoGame         — idempotent insert, new row appended at end
//   - RemoveCasinoGame      — idempotent delete
//   - UpdateCasinoGameOrder — set per-collection sort position for one game
// ---------------------------------------------------------------------------
service CollectionService {
  rpc Save(SaveCollectionCommand) returns (Empty);

  rpc Find(FindCollectionQuery) returns (FindCollectionQuery.Result);

  rpc FindAll(FindAllCollectionQuery) returns (FindAllCollectionQuery.Result);

  rpc Batch(BatchCollectionQuery) returns (BatchCollectionQuery.Result);

  rpc FindAllCasinoGame(FindAllCasinoGameCollectionQuery) returns (CasinoGamePageDto);

  rpc AddCasinoGame(AddCollectionCasinoGameCommand) returns (Empty);

  rpc RemoveCasinoGame(RemoveCollectionCasinoGameCommand) returns (Empty);

  rpc UpdateCasinoGameOrder(UpdateCollectionCasinoGameOrderCommand) returns (Empty);

  rpc UpdateImage(UpdateCollectionImageCommand) returns (Empty);

  rpc Delete(DeleteCollectionCommand) returns (Empty);
}

// ---------------------------------------------------------------------------
// Commands
// ---------------------------------------------------------------------------

message SaveCollectionCommand {
  string identity = 1;

  // Localized name map (locale → display name), e.g. {"en": "Popular", "ru": "Популярные"}.
  map<string, string> name = 2;

  bool active = 3;

  int32 order = 4;

  // Collection's own tags (same free-form vocabulary as CasinoGame.tags). Full replace on every Save.
  repeated string tags = 5;
}

// Add a single game to a collection. Idempotent — if the game is already
// in the collection, the call is a no-op. On first insert the new row is
// appended at the end (sort_order = max existing + 1, or 0 when empty).
// Fails with NOT_FOUND if the collection or the game does not exist.
message AddCollectionCasinoGameCommand {
  string identity = 1;

  string game_identity = 2;
}

// Remove a single game from a collection. Idempotent — if the game is not
// currently a member, the call is a no-op. Fails with NOT_FOUND if the
// collection or the game does not exist.
message RemoveCollectionCasinoGameCommand {
  string identity = 1;

  string game_identity = 2;
}

// Set the per-collection display order for a single game inside a
// collection. Fails with NOT_FOUND if the collection does not exist, or if
// the game is not currently a member of the collection.
message UpdateCollectionCasinoGameOrderCommand {
  string identity = 1;

  string game_identity = 2;

  int32 order = 3;
}

// Delete a collection and every game membership it holds. Deleting a
// collection never deletes games — only the rail and its ordering.
// Fails with NOT_FOUND if the collection does not exist.
message DeleteCollectionCommand {
  string identity = 1;
}

message UpdateCollectionImageCommand {
  string identity = 1;

  string key = 2;

  // Was `bytes file` + `string extension` — the engine no longer accepts file
  // content. Callers upload to object storage themselves and pass the final
  // public URL.
  reserved 3, 4;

  reserved "file", "extension";

  // Full public URL of the image; stored verbatim as the map value for `key`.
  string url = 5;
}

// ---------------------------------------------------------------------------
// Queries
// ---------------------------------------------------------------------------

message FindCollectionQuery {
  string identity = 1;

  message Result {
    CollectionDto item = 1;
  }
}

message CollectionFilter {
  string query = 1;

  optional bool active = 2;

  // Matches collections carrying ANY of these tags (the collection's OWN tags — same semantics as
  // CasinoGameFilter.tags for games; previously this matched the tags of member games, unused by any caller).
  repeated string in_tags = 3;

  // Matches collections that CONTAIN at least one game of any of these providers.
  repeated string in_provider_identities = 4;
}

message FindAllCollectionQuery {
  CollectionFilter filter = 1;

  int32 page_num = 2;

  int32 page_size = 3;

  message Result {
    repeated CollectionDto items = 1;

    int32 total_items = 2;
  }
}

message BatchCollectionQuery {
  repeated string identities = 1;

  message Result {
    repeated CollectionDto items = 1;
  }
}

// Paged game listing narrowed to a specific collection. Uses the shared
// `CasinoGameFilter` and returns the shared `CasinoGamePageDto` — the only extra input
// is `collection_identity`, which picks which collection's games to read.
message FindAllCasinoGameCollectionQuery {
  string collection_identity = 1;

  CasinoGameFilter filter = 2;

  int32 page_num = 3;

  int32 page_size = 4;
}
