syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

import "game/v1/dto/jackpot.dto.proto";

// ---------------------------------------------------------------------------
// Universal jackpot stream — an open (un-authenticated) server stream of one
// provider's jackpot. The request names the PROVIDER (aggregator) and the
// JACKPOT IDENTITY: casino-engine resolves that provider and bridges its public
// jackpot WebSocket through its own JackpotStreamAdapter, then streams only the
// frames for the requested jackpot identity. A provider may expose several
// jackpots; each is addressed by (provider, identity). No session — the same
// frames are pushed to every client.
//
// Each frame: identity, currency, the sales window (start_at / end_at, epoch
// millis), a status, and one-or-more prizes (amount in minor units as a string
// + the prize identity).
// ---------------------------------------------------------------------------
service JackpotService {
  rpc Stream(JackpotStreamRequest) returns (stream JackpotDto);
}

message JackpotStreamRequest {
  // Provider (aggregator) identity whose jackpot to stream, e.g. "tongame".
  string provider = 1;

  // Jackpot identity to stream, e.g. "lottery". Blank = any jackpot of the provider.
  string identity = 2;
}
