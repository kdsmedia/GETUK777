syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

import "game/v1/dto/jackpot.dto.proto";

// ---------------------------------------------------------------------------
// Universal jackpot stream — an open (un-authenticated) server stream of a given
// provider's currently active jackpot/draw. The jackpot is resolved PER AGGREGATOR
// (provider): the request names the aggregator, and casino-engine bridges THAT
// provider's public jackpot WebSocket through its own JackpotStreamAdapter. Every
// provider that exposes a jackpot can be streamed the same way; there is no session,
// so the same frames are pushed to every client.
//
// Each frame describes one active jackpot: its identity, currency, the sales window
// (start_at / end_at, epoch millis), a status, and one-or-more prizes (amount in
// minor units as a string + the prize identity).
// ---------------------------------------------------------------------------
service JackpotService {
  rpc Stream(JackpotStreamRequest) returns (stream JackpotDto);
}

message JackpotStreamRequest {
  // The aggregator (provider) identity whose jackpot to stream, e.g. "tongame".
  string aggregator = 1;
}
