syntax = "proto3";

package game.v1;

option java_package = "com.nekgamebling.game.v1";
option java_multiple_files = true;

import "game/v1/dto/casino_game.dto.proto";
import "game/v1/dto/common.dto.proto";
import "game/v1/dto/casino_game_filter.dto.proto";

service WinnerService {
  rpc FindAll(FindAllWinnersQuery) returns (FindAllWinnersQuery.Result);
}

// Ordering of the winners feed. Always DESCENDING — a winners board is either
// "latest wins" or "biggest wins"; ascending has no product meaning, so there is
// deliberately no direction flag. Ties break on the spin id so paging is stable.
enum WinnerSortDto {
  WINNER_SORT_UNSPECIFIED = 0;  // treated as WINNER_SORT_DATE

  WINNER_SORT_DATE = 1;

  WINNER_SORT_AMOUNT = 2;
}

message FindAllWinnersQuery {
  // Was `optional string game_identity` — superseded by the full `filter` below.
  reserved 1;
  reserved "game_identity";

  optional int64 min_amount = 2;

  optional int64 max_amount = 3;

  optional string currency = 4;

  optional string player_id = 5;

  optional string from_date = 6;

  optional string to_date = 7;

  int32 page_num = 8;

  int32 page_size = 9;

  // Restricts the feed to wins on games matching this filter — the same
  // CasinoGameFilter every game listing takes (provider, collection, tags, flags).
  // Unset = wins on any game.
  CasinoGameFilter filter = 10;

  WinnerSortDto sort = 11;

  message Result {
    repeated WinnerItemDto items = 1;

    int32 total_items = 2;

    int32 total_pages = 3;

    int32 current_page = 4;
  }
}

message WinnerItemDto {
  CasinoGameDto game = 1;

  int64 amount = 2;

  string currency = 3;

  string player_id = 4;

  string date = 5;
}
